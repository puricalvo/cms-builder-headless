<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba Redsys</title>
</head>

<body>

    ```
    <h1>Prueba Redsys</h1>

    <p id="mensaje">
        Iniciando pago de 1,00 €...
    </p>

    <script>

        async function iniciarPago() {

            try {

                const response = await fetch(
                    "http://cms-builder-headless-api.com/redsys",
                    {
                        method: "POST",

                        headers: {
                            "Authorization": "fgadsfg34fhfgj456erF****************",
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            amount: 100
                        })
                    }
                );

                const text = await response.text();

                console.log(
                    "RESPUESTA REDSYS:",
                    text
                );

                if (!response.ok) {

                    document.getElementById(
                        "mensaje"
                    ).textContent =
                        "Error HTTP " + response.status;

                    console.error(text);

                    return;

                }

                /*
                 * La librería oficial de Redsys genera
                 * el HTML necesario para realizar
                 * la redirección al TPV.
                 *
                 * fetch() lo recibe como texto.
                 *
                 * Ahora hacemos que el navegador
                 * cargue esa respuesta como una página.
                 */

                if (text.trim() !== "") {

                    document.open();

                    document.write(text);

                    document.close();

                    return;

                }

                document.getElementById(
                    "mensaje"
                ).textContent =
                    "Redsys no ha devuelto contenido.";

            } catch (error) {

                console.error(
                    "Error iniciando el pago:",
                    error
                );

                document.getElementById(
                    "mensaje"
                ).textContent =
                    "Error iniciando el pago.";

            }

        }

        iniciarPago();

    </script>
    ```

</body>

</html>
